name = "catcounter"
main = "packages/worker/src/index.ts"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "catcounter"
# 故意不写 database_id：Wrangler 会在首次部署时自动创建并绑定同名 D1 数据库。

[assets]
directory = "packages/worker/assets"
binding = "ASSETS"
run_worker_first = ["/api/*", "/admin/*", "!/admin/assets/*"]

[triggers]
crons = ["10 0 * * *"]

[observability]
enabled = true
