name = "catcounter"
main = "packages/worker/src/index.ts"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "catcounter"
# 部署前把下面的值换成你在 Cloudflare 控制台创建的 D1 数据库 ID
database_id = "00000000-0000-0000-0000-000000000000"

[assets]
directory = "packages/worker/assets"
binding = "ASSETS"
run_worker_first = ["/api/*", "/admin/*", "!/admin/assets/*"]

[triggers]
crons = ["10 0 * * *"]

[observability]
enabled = true
